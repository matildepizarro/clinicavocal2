<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body{
    position:relative;
    background:#fff5fa;
    background-image:
      radial-gradient(900px 560px at 12% -8%, #ffeaf4 0%, #fff5fa 55%),
      radial-gradient(700px 500px at 108% 105%, #f6f3ff 0%, rgba(255,245,250,0) 60%);
    font-family:'Fraunces', Georgia, serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .decor{ position:absolute; border-radius:50%; opacity:.55; }
  .d1{ width:260px; height:260px; left:-70px; top:-70px; background:radial-gradient(circle, #ffd9ec 0%, rgba(255,217,236,0) 70%); }
  .d2{ width:340px; height:340px; right:-90px; bottom:-110px; background:radial-gradient(circle, #e6def7 0%, rgba(230,222,247,0) 70%); }
  .d3{ width:180px; height:180px; right:60px; top:40px; background:radial-gradient(circle, #ffe3c9 0%, rgba(255,227,201,0) 70%); }

  .card{
    position:relative;
    width:1080px; height:510px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding:0 90px;
  }
  .eyebrow{
    font-family:'Inter', system-ui, sans-serif;
    font-size:19px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:#e0a640; margin-bottom:22px;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow .dot{ width:9px; height:9px; border-radius:50%; background:#e0559e; display:inline-block; }
  h1{
    font-size:78px; line-height:1.05; color:#4a2140; font-weight:600;
    margin-bottom:26px; max-width:920px;
  }
  h1 em{ font-style:italic; color:#e0559e; font-weight:500; }
  p.tagline{
    font-family:'Inter', system-ui, sans-serif;
    font-size:28px; line-height:1.45; color:#8a5b7a; max-width:760px; margin-bottom:34px;
  }
  .pills{ display:flex; gap:14px; flex-wrap:wrap; }
  .pill{
    font-family:'Inter', system-ui, sans-serif;
    font-size:20px; font-weight:600; color:#4a2140;
    background:#ffffffb0; border:1.5px solid #f0cfe0; border-radius:999px;
    padding:10px 22px 12px;
    box-shadow:0 6px 16px rgba(120,50,100,.08);
  }
  .pill.rose{ color:#a1327a; border-color:#f3b9d8; }
  .pill.gold{ color:#9c6c17; border-color:#f0d9a6; }
  .pill.teal{ color:#2f8768; border-color:#bfe6d6; }
</style>
</head>
<body>
  <div class="decor d1"></div>
  <div class="decor d2"></div>
  <div class="decor d3"></div>
  <div class="card">
    <div class="eyebrow"><span class="dot"></span>Consultorio Vocal</div>
    <h1>Herramientas para <em>Fonoaudiología</em> vocal</h1>
    <p class="tagline">12 herramientas clínicas gratuitas y trilingües — entrenamiento vocal, evaluación, bitácora de sesiones y más. 100% privado, sin servidores.</p>
    <div class="pills">
      <div class="pill rose">Sin costo</div>
      <div class="pill gold">ES · PT · EN</div>
      <div class="pill teal">Funciona offline</div>
    </div>
  </div>
</body>
</html>
